services:
  app:
    build: .
    image: super-planner:latest
    container_name: super-planner
    restart: unless-stopped
    env_file:
      - .env
    # 호스트 3000 → 컨테이너 3000. Caddy/Nginx 같은 리버스 프록시 뒤에서 쓰도록 설계됨.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # SQLite DB 파일을 호스트 ./data 에 보존 (컨테이너 재생성해도 데이터 유지)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 옵션: Caddy 리버스 프록시를 같이 돌리고 싶으면 아래 주석 해제 + Caddyfile 준비
