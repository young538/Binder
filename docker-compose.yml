services:
  app:
    build: .
    image: super-planner:latest
    container_name: super-planner
    restart: unless-stopped
    env_file:
      - app.env
    # 호스트 3000 → 컨테이너 3000. Caddy/Nginx 같은 리버스 프록시 뒤에서 쓰도록 설계됨.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # SQLite DB 파일을 호스트 ./data 에 보존 (컨테이너 재생성해도 데이터 유지)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: super-planner:latest
    restart: unless-stopped
    command: ["node", "scripts/backup-scheduler.mjs"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      DB_PATH: /source/binder.sqlite
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_TIMEZONE: Asia/Seoul
      BACKUP_HOUR: "3"
    volumes:
      - ./data:/source:ro
      - ./backups:/backups
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/backup.mjs", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: super-planner-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
